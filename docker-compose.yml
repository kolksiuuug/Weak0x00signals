name: weak-signals

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-signals}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signals} -d ${POSTGRES_DB:-signals}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEAK_SIGNAL_THRESHOLD: ${WEAK_SIGNAL_THRESHOLD:-0.55}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-signals}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-signals}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  parser:
    build:
      context: .
      dockerfile: parser/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_MODEL: ${LLM_MODEL:-GigaChat 2 Max}
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
      GIGACHAT_RQUID: ${GIGACHAT_RQUID:-}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-true}
      LLM_REQUIRED: ${LLM_REQUIRED:-false}
      LLM_SEARCH_EXPANSION: ${LLM_SEARCH_EXPANSION:-false}
      LLM_LAZY_ENRICHMENT: ${LLM_LAZY_ENRICHMENT:-true}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-45}
      PATENTSVIEW_API_KEY: ${PATENTSVIEW_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_ALLOW_HASH_FALLBACK: ${EMBEDDING_ALLOW_HASH_FALLBACK:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-signals}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-signals}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ML_URL: http://ml:8000
      PARSER_URL: http://parser:8000
      REDIS_URL: redis://redis:6379/0
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-90}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-signals}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-signals}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.75}
    depends_on:
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
      parser:
        condition: service_healthy
    networks: [backend, edge]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [edge]

  reverse-proxy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      # Безопасный локальный fallback: никогда не занимает 80/443 на VPS.
      # Для VPS с Nginx Proxy Manager внешний трафик идёт по docker-сети proxy.
      - "127.0.0.1:${LOCAL_PORT:-18080}:8080"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
    networks:
      edge:
      proxy:
        aliases:
          - weak-signals

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
  # Создаётся deploy-vps.sh и к нему подключается существующий Nginx Proxy Manager.
  proxy:
    name: ${PROXY_NETWORK:-weak-signals-proxy}
    external: true

volumes:
  postgres_data:
  hf_cache:
  caddy_data:
  caddy_config:
